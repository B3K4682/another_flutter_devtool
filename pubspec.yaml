name: another_flutter_devtool
description: "An in-app devtool for Flutter: a draggable launcher opens a panel with app info, a network inspector, data usage and route navigation tools."
version: 0.5.3
homepage: https://github.com/B3K4682/another_flutter_devtool
repository: https://github.com/B3K4682/another_flutter_devtool
issue_tracker: https://github.com/B3K4682/another_flutter_devtool/issues
topics:
  - devtools
  - debugging
  - network
  - developer-tools
  - inspector
screenshots:
  - description: Devtool home screen with the General, Network and a custom section.
    path: screenshots/home.png
  - description: General section with app information, internet data usage and configuration tools.
    path: screenshots/general.png
  - description: Network section listing HTTP calls with status filters and search.
    path: screenshots/network.png
  - description: Custom section with app-defined tools.
    path: screenshots/custom_tools.png

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
