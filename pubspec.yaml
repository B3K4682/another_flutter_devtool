name: another_flutter_devtool
description: "An in-app devtool for Flutter with a draggable floating launcher and a full-screen devtool panel."
version: 0.3.0
homepage: https://github.com/B3K4682/another_flutter_devtool
repository: https://github.com/B3K4682/another_flutter_devtool
issue_tracker: https://github.com/B3K4682/another_flutter_devtool/issues

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
