name: Publish to pub.dev

on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          name=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the pubspec version
        run: |
          if [ "${GITHUB_REF}" != "refs/tags/v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Ref ${GITHUB_REF} does not match pubspec version v${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check whether the version is already on pub.dev
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/${{ steps.version.outputs.name }}/versions/${{ steps.version.outputs.version }}")
          if [ "${status}" = "200" ]; then
            echo "Version ${{ steps.version.outputs.version }} is already on pub.dev, skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dart-lang/setup-dart@v1
        if: steps.published.outputs.exists == 'false'

      - uses: subosito/flutter-action@v2
        if: steps.published.outputs.exists == 'false'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.published.outputs.exists == 'false'
        run: flutter pub get

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: flutter pub publish --force
