name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Check CHANGELOG has an entry for the pubspec version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          if ! grep -qx "## ${version}" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Missing '## ${version}' section for pubspec version ${version}"
            exit 1
          fi

      - name: Validate package for pub.dev
        run: flutter pub publish --dry-run

      - name: Install example dependencies
        run: flutter pub get --directory example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test

      - name: Analyze package
        run: flutter analyze

      - name: Analyze example
        run: flutter analyze example

      - name: Run tests
        run: flutter test
